# fly.toml app configuration file generated for sshx-ubuntu-app on 2026-10-30T14:28:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "sshx-ubuntu-app" # Burayı değiştirmeyi unutma
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '4gb'
  memory_mb = 4096
  processes = ['app']
  size = 'shared-cpu-2x'
